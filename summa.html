<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VK Construction Properties</title>

<!-- BOOTSTRAP -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- ICONS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>

/* SECTION */
.vkFullProp-section {
  background: #f5f7fa;
}

/* CARD */
.vkFullProp-card {
  background: #fff;
  border-radius: 18px;
  overflow: hidden;
  transition: 0.4s;
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
  height: 100%;
}

/* IMAGE */
.vkFullProp-img {
  position: relative;
}

.vkFullProp-img img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  transition: 0.4s;
}

/* PRICE TAG */
.vkFullProp-price {
  position: absolute;
  top: 12px;
  left: 12px;
  background: #ff6600;
  color: #fff;
  padding: 6px 14px;
  border-radius: 25px;
  font-size: 13px;
  font-weight: 500;
}

/* CONTENT */
.vkFullProp-content {
  padding: 18px;
}

.vkFullProp-content h6 {
  font-weight: 600;
}

/* LOCATION */
.vkFullProp-loc {
  font-size: 13px;
  color: #666;
  margin-bottom: 10px;
}

/* DETAILS */
.vkFullProp-list {
  list-style: none;
  padding: 0;
  margin: 0;
  font-size: 13px;
}

.vkFullProp-list li {
  margin-bottom: 6px;
  color: #555;
}

.vkFullProp-list i {
  color: #ff6600;
  margin-right: 6px;
}

/* BUTTON */
.vkFullProp-btn {
  display: inline-block;
  margin-top: 12px;
  padding: 8px 18px;
  background: #ff6600;
  color: #fff;
  border-radius: 25px;
  text-decoration: none;
  font-size: 13px;
  transition: 0.3s;
}

.vkFullProp-btn:hover {
  background: #000;
}

/* HOVER EFFECT */
.vkFullProp-card:hover {
  transform: translateY(-10px);
  box-shadow: 0 18px 40px rgba(0,0,0,0.1);
}

.vkFullProp-card:hover img {
  transform: scale(1.06);
}

</style>
</head>

<body>



</body>
</html>
